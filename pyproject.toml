[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intelligence-ingestion"
version = "0.1.0"
description = "Source-traceable async ingestion pipeline for AI ecosystem data"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "tenacity>=8.2,<10",
  "python-dateutil>=2.9,<3",
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "typer>=0.12,<1",
  "structlog>=24,<26",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2", "ruff>=0.3,<1", "mypy>=1.8,<2", "respx>=0.21,<1"]

[project.scripts]
ai-ingest = "ai_ingest.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
